packages:
  - .
storeDir: .pnpm-store
nodeLinker: hoisted
verifyDepsBeforeRun: false
# VoxCue uses its own pinned text embedder, not LanceDB's optional providers.
# Mammoth's argparse dependency belongs only to its unused standalone CLI.
overrides:
  '@lancedb/lancedb>@huggingface/transformers': '-'
  '@lancedb/lancedb>openai': '-'
  'mammoth>argparse': '-'
allowBuilds:
  electron: true
  esbuild: true
  onnxruntime-node: true
  sharp: true
  protobufjs: true
  # NSIS packaging does not use Squirrel.Windows or its install scripts.
  electron-winstaller: false
  # The SDK uses its bundled subprocess; the unused in-process FFI needs no build.
  koffi: false
minimumReleaseAgeExclude:
  - '@github/copilot-sdk-darwin-arm64@1.0.21'
  - '@github/copilot-sdk-darwin-x64@1.0.21'
  - '@github/copilot-sdk-linux-arm64@1.0.21'
  - '@github/copilot-sdk-linux-x64@1.0.21'
  - '@github/copilot-sdk-linuxmusl-arm64@1.0.21'
  - '@github/copilot-sdk-linuxmusl-x64@1.0.21'
  - '@github/copilot-sdk-win32-arm64@1.0.21'
  - '@github/copilot-sdk-win32-x64@1.0.21'
  - '@github/copilot-sdk@1.0.21'

supportedArchitectures:
  os: [win32]
  cpu: [x64]
