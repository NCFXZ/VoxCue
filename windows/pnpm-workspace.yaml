packages:
  - .
storeDir: .pnpm-store
nodeLinker: hoisted
verifyDepsBeforeRun: false
# Official stable release verified against electron/electron; includes #52633.
minimumReleaseAgeExclude:
  - electron@44.10.0
# VoxCue uses its own pinned text embedder, not LanceDB's optional providers.
# Mammoth's argparse dependency belongs only to its unused standalone CLI.
overrides:
  # GHSA-238p-pmpm-9mq7: reject inherited renderer settings/macros in every math path.
  'katex': '0.18.2'
  # GHSA-mrhx-c7xc-m3w5: reject oversized collections before walking elements.
  '@github/copilot-sdk>zod': '4.6.6'
  # Security fixes for the build tools; runtime/provider versions stay pinned.
  'undici@6': '6.29.1'
  'fast-uri': '3.1.9'
  # GHSA-g3hv-75wg-m249 / GHSA-3g3m-2fjr-6pw4: build-only glob safety.
  'glob@13': '14.0.2'
  'minimatch': '11.0.1'
  # Reuse the modern ASAR/Universal APIs already used by Packager; remove
  # NSIS-unused Squirrel and EJS's CLI task runner instead of retaining legacy globs.
  '@electron/asar@3': '4.3.1'
  '@electron/universal@2': '3.0.6'
  'app-builder-lib>electron-builder-squirrel-windows': '-'
  'ejs>jake': '-'
  '@lancedb/lancedb>@huggingface/transformers': '-'
  '@lancedb/lancedb>openai': '-'
  'mammoth>argparse': '-'
  # Legacy DOC uses only the fixed OLE reader; DOCX keeps Mammoth.
  'word-extractor>saxes': '-'
  'word-extractor>yauzl': '-'
allowBuilds:
  electron: true
  esbuild: true
  onnxruntime-node: true
  sharp: true
  protobufjs: true
  # NSIS packaging does not use Squirrel.Windows or its install scripts.
  electron-winstaller: false
  # Copilot uses the bundled subprocess, not the optional in-process FFI.
  koffi: false

supportedArchitectures:
  os: [win32]
  cpu: [x64]
