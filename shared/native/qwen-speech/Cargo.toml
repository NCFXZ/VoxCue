[package]
name = "voxcue-qwen"
version = "0.1.0"
edition = "2021"
[features]
default = ["cuda"]
cuda = ["qwen3-asr/cuda", "qwen-forced-aligner-rs/cuda", "dep:cudarc"]
[dependencies]
qwen3-asr = { path = "vendor/qwen3-asr", default-features = false }
candle-core = "=0.9.2"
serde_json = "1"
base64 = "0.22"
anyhow = "1"
qwen-forced-aligner-rs = { path = "vendor/qwen-aligner", default-features = false, features = ["cpu"] }
cudarc = { version = "=0.19.10", features = ["cuda-12090", "driver"], optional = true }
[profile.release]
opt-level = 3
