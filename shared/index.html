<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://a.favicon.im https://www.gstatic.com; media-src 'self' voxcue-recording:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/png" href="./voxcue.png" />
    <title>VoxCue</title>
    <style>
      /* Applied before the first paint and retained when React takes over. */
      .startup-title {
        font: 600 var(--type-title, 18px) / var(--line-body, 1.75) system-ui;
        font-synthesis: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-label="正在启动 VoxCue"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f5f6f7;
          color: #24282b;
        "
      >
        <img src="./voxcue.png" alt="" width="88" height="88" />
        <strong class="startup-title">VoxCue</strong>
      </div>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
